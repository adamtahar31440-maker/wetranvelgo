<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f333f" />
    <title>Hors connexion — WeTravelGo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: #fbfaf7;
        color: #1c2b33;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; }
      h1 { margin: 16px 0 8px; font-size: 1.25rem; color: #0f333f; }
      p { margin: 4px 0; color: #1c2b33b3; font-size: 0.95rem; }
      button {
        margin-top: 20px;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        background: #bf6a45;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Vérifiez votre connexion internet puis réessayez.</p>
      <p lang="en">You are offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
